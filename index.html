<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Program — Purchasing Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --obsidian:#0B0F1A; --panel:#131A2B; --panel2:#0F1524; --rule:#24314D; --rule-soft:#1B2438;
  --ink:#E8ECF4; --muted:#8A94A8; --faint:#5A6478;
  --gold:#D4AF6A; --gold-deep:#A9823F; --gold-soft:rgba(212,175,106,.14);
  --green:#3E9B6F; --green-soft:rgba(62,155,111,.14);
  --red:#C25B5B; --red-soft:rgba(194,91,91,.13);
  --amber:#D99A3D; --amber-soft:rgba(217,154,61,.13);
  --mono:'JetBrains Mono',monospace; --body:'Inter',sans-serif; --display:'Fraunces',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
body{background:var(--obsidian);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;min-height:100vh}
::selection{background:var(--gold-soft)}
a{color:var(--gold)}
button{font-family:var(--body)}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
/* ── sidebar ── */
aside{background:var(--panel2);border-right:1px solid var(--rule-soft);padding:22px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:0 22px 20px;border-bottom:1px solid var(--rule-soft)}
.brand .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.brand h1{font-family:var(--display);font-weight:600;font-size:21px;margin-top:6px;color:var(--ink)}
nav{flex:1;padding:18px 10px;display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--muted);font:500 13.5px var(--body);padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;border-left:2px solid transparent}
.nav-btn:hover{color:var(--ink);background:rgba(255,255,255,.03)}
.nav-btn.active{color:var(--ink);background:var(--gold-soft);border-left:2px solid var(--gold)}
.nav-btn .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--gold);background:rgba(212,175,106,.1);padding:1px 7px;border-radius:99px}
.rolebox{padding:16px 22px 0;border-top:1px solid var(--rule-soft)}
.rolebox label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;color:var(--faint)}
.rolebox select{width:100%;margin-top:8px;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:9px 10px;font:500 13px var(--body)}
.rolebox .who{margin-top:8px;font-size:12px;color:var(--muted)}
/* ── main ── */
main{padding:34px 40px 80px;max-width:1240px;width:100%}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}
.topbar .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.topbar h2{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.01em;margin-top:6px}
.topbar .sub{color:var(--muted);margin-top:6px;font-size:13.5px;max-width:60ch}
.btn{background:var(--gold);color:#14100A;border:0;font:600 13px var(--body);padding:10px 16px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--rule)}
.btn.ghost:hover{color:var(--ink);border-color:var(--gold)}
.btn.small{padding:6px 11px;font-size:12px;border-radius:7px}
.btn.approve{background:var(--green)}
.btn.reject{background:transparent;color:var(--red);border:1px solid rgba(194,91,91,.5)}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat{background:var(--panel);border:1px solid var(--rule-soft);border-radius:12px;padding:16px 18px}
.stat .n{font-family:var(--mono);font-weight:600;font-size:26px;color:var(--ink)}
.stat .n.gold{color:var(--gold)}
.stat .l{color:var(--muted);font-size:12px;margin-top:4px}
main{margin-inline:auto}
/* panels & tables */
.panel{background:var(--panel);border:1px solid var(--rule-soft);border-radius:14px;overflow:hidden;margin-bottom:22px}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--rule-soft)}
.panel-h h3{font:600 14.5px var(--body)}
.panel-h .hint{color:var(--faint);font-size:12px}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:1px solid var(--rule);font-weight:600;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
tbody tr:hover{background:rgba(255,255,255,.02)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.right{text-align:right}
.badge{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--body);padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-quoting{background:var(--amber-soft,rgba(217,154,61,.13));color:var(--amber)}
.b-pending{background:var(--gold-soft);color:var(--gold)}
.b-approved{background:var(--green-soft);color:var(--green)}
.b-rejected{background:var(--red-soft);color:var(--red)}
.b-ordered{background:rgba(90,140,220,.14);color:#7EA6E8}
.venture{font:600 11px var(--mono);color:var(--muted);letter-spacing:.04em}
/* request detail */
.crumbs{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:12.5px;margin-bottom:14px;cursor:pointer}
.crumbs b{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv-k{color:var(--faint)}
.quote-cols{grid-template-columns:1fr;gap:10px;margin-top:12px}
.qcard{background:var(--panel2);border:1px solid var(--rule-soft);border-radius:12px;padding:14px;position:relative}
.qcard.winner{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.qcard .vendor{font:600 14px var(--body);display:flex;align-items:center;gap:8px}
.qcard .crown{color:var(--gold);font-size:13px}
.qrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:5px 0;border-bottom:1px dashed var(--rule-soft)}
.qrow .num{color:var(--ink);white-space:nowrap}
.qtotal{display:flex;justify-content:space-between;padding-top:10px;font:600 14px var(--body);white-space:nowrap}
.qtotal .num{color:var(--gold);font-size:15px}
.variance{font-family:var(--mono);font-size:11px;color:var(--red);margin-top:2px}
.variance.best{color:var(--green)}
.doc-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--rule-soft);border-radius:7px;padding:4px 9px;font-size:11.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* matrix */
.matrix th.vendor-h{color:var(--gold)}
.matrix th:not(:first-child),.matrix td:not(:first-child){text-align:right}
.matrix td.gap{color:var(--red);font-style:italic}
.matrix tr.total-row td{border-top:2px solid var(--rule);font-weight:600;color:var(--ink)}
.matrix td.best-cell{color:var(--gold);font-weight:600}
.stamp{display:inline-block;font:600 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--green);border:2px solid var(--green);border-radius:6px;padding:4px 10px;transform:rotate(-4deg)}
.stamp.gold{color:var(--gold);border-color:var(--gold)}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font:600 12px var(--body);color:var(--muted)}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--rule);border-radius:8px;color:var(--ink);padding:9px 11px;font:400 13px var(--body)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
.lines-box{border:1px solid var(--rule-soft);border-radius:10px;overflow:hidden}
.lines-box table td{padding:8px 10px}
.lines-box input{width:100%;background:transparent;border:0;color:var(--ink);font:400 13px var(--body)}
.lines-box input:focus{outline:none}
.addline{color:var(--gold);background:none;border:0;font:600 12.5px var(--body);cursor:pointer;padding:9px 14px}
.modal-bg{position:fixed;inset:0;background:rgba(5,8,15,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:26px;width:720px;max-width:96vw;max-height:92vh;overflow:auto}
.modal h3{font-family:var(--display);font-size:21px;font-weight:600;margin-bottom:4px}
.modal .msub{color:var(--muted);font-size:13px;margin-bottom:18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--ink);padding:11px 18px;border-radius:10px;font:500 13px var(--body);z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.audit{font-size:12.5px;color:var(--muted)}
.audit .t{font-family:var(--mono);font-size:11px;color:var(--faint);margin-right:8px}
.empty{padding:40px;text-align:center;color:var(--faint)}
.empty .big{font-family:var(--display);font-size:17px;color:var(--muted);margin-bottom:6px}
pre.payload{background:var(--panel2);border:1px solid var(--rule-soft);border-radius:10px;padding:14px;font:400 11.5px var(--mono);overflow:auto;max-height:340px;color:#B9C4DA}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  aside{position:relative;height:auto;flex-direction:row;align-items:center;gap:12px;padding:12px 16px}
  nav{flex-direction:row;overflow-x:auto;padding:0}
  .brand h1{font-size:16px}
  .rolebox{border:0;padding:0 8px}
  main{padding:22px 16px 60px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2,.quote-cols,.form-col{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.stamp{animation:stamp .35s ease-out}@keyframes stamp{0%{transform:rotate(-4deg) scale(1.6);opacity:0}100%{transform:rotate(-4deg);opacity:1}}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="eyebrow">Purchasing desk</div>
      <h1>Quote Program</h1>
    </div>
    <nav id="nav"></nav>
    <div class="rolebox">
      <label>Acting as</label>
      <select id="roleSel">
        <option value="manager">Manager — approval desk</option>
        <option value="purchaser">Purchaser — sourcing</option>
        <option value="requester">Requester — department</option>
      </select>
      <style>#roleSel{max-width:100%;text-overflow:ellipsis}</style>
      <div class="who" id="whoLine"></div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ============================== state ============================== */
const LS_KEY = 'quoteprogram.v1';
const VENTURES = ['Infinity Brands','The Local Farmer','Papa Pasta','INFX Media','INFX Solutions','INFX Labs','FluxFlow','ACDC Express'];
const DEPTS = ['Operations','Purchasing','Sales & Marketing','Finance','Production','Logistics','Admin','IT'];
const money = n => 'R ' + (Math.round((+n||0)*100)/100).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today = () => new Date().toISOString().slice(0,10);

function seed(){
  return {
    role:'manager', seq:{rq:3, po:1},
    requests:[
      { id:'RQ-2026-0003', venture:'The Local Farmer', department:'Production', requester:'Thabo M.', neededBy: today(), status:'quoting',
        notes:'Monthly substrate restock — bulk pricing needed.',
        lines:[{item:'Hardwood sawdust', spec:'Per kg, dry, untreated', qty:'2000'},
               {item:'Bran flour', spec:'Per kg, fine mill', qty:'400'},
               {item:'Hydrated lime', spec:'1.5kg packs', qty:'20'}],
        quotes:[], winner:null, poNumber:null,
        audit:[{ts:Date.now()-86400000*2, actor:'Thabo M.', action:'Request created', note:'3 lines, needed by month-end'}]},
      { id:'RQ-2026-0002', venture:'Papa Pasta', department:'Operations', requester:'Nadia K.', neededBy: today(), status:'pending',
        notes:'Cold-room shelving replacement before Friday service.',
        lines:[{item:'Stainless shelving unit', spec:'5-tier, 1800mm', qty:'4'},
               {item:'NSF food pans', spec:'1/3 size, 65mm', qty:'60'}],
        quotes:[
          {vendor:'Caterwise Equipment', doc:{name:'caterwise-quote-04sep.pdf', size:'412 KB'}, prices:{0:2850,1:96}, delivery:650, leadDays:5, validUntil:'2026-10-04'},
          {vendor:'Kitchenline CC', doc:{name:'kitchenline-quote-q3.pdf', size:'298 KB'}, prices:{0:3195,1:84}, delivery:0, leadDays:2, validUntil:'2026-09-30'},
          {vendor:'ProResto Supplies', doc:{name:'prorest-shelving.pdf', size:'355 KB'}, prices:{0:2690,1:101}, delivery:850, leadDays:7, validUntil:'2026-10-15'}
        ], winner:null, poNumber:null,
        audit:[{ts:Date.now()-86400000*5, actor:'Nadia K.', action:'Request created', note:'Replacement after old unit rust'},
               {ts:Date.now()-86400000*1, actor:'S. Petersen (Purchasing)', action:'3 quotes attached', note:'All vendors confirmed stock'}]},
      { id:'RQ-2026-0001', venture:'INFX Labs', department:'IT', requester:'Dineo M.', neededBy: today(), status:'ordered',
        lines:[{item:'Workstation RAM upgrade', spec:'64GB DDR5 kit', qty:'6'}],
        quotes:[
          {vendor:'Wootware', doc:{name:'wootware-ram-quote.pdf', size:'180 KB'}, prices:{0:4299}, delivery:120, leadDays:2, validUntil:'2026-09-15'},
          {vendor:' Evetech', doc:{name:'evetech-64gb.pdf', size:'166 KB'}, prices:{0:4150}, delivery:150, leadDays:3, validUntil:'2026-09-12'},
          {vendor:'Wootware (volume)', doc:{name:'wootware-vol.pdf', size:'171 KB'}, prices:{0:3999}, delivery:120, leadDays:5, validUntil:'2026-10-01'}
        ], winner:2, poNumber:'PO-2026-0001',
        audit:[{ts:Date.now()-86400000*8, actor:'Dineo M.', action:'Request created', note:'New dev rigs'},
               {ts:Date.now()-86400000*6, actor:'S. Petersen (Purchasing)', action:'3 quotes attached', note:''},
               {ts:Date.now()-86400000*6, actor:'Ricardo Maio', action:'Approved — Wootware (volume)', note:'Volume price wins, 5-day lead acceptable'},
               {ts:Date.now()-86400000*6, actor:'System', action:'PO-2026-0001 generated', note:'Zoho payload exported'}]}
    ]
  };
}
let db;
try{ db = JSON.parse(localStorage.getItem('quoteprogram.v1')) || seed(); }catch(e){ db = seed(); }
const save = () => localStorage.setItem('quoteprogram.v1', JSON.stringify(db));
save();

/* ============================== helpers ============================== */
const $ = s => document.querySelector(s);
const main = () => $('#main');
const fmtD = ts => new Date(ts).toLocaleDateString('en-ZA',{day:'2-digit',month:'short'});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function statusBadge(st){
  const map={quoting:['b-quoting','Quoting'],pending:['b-pending','Pending approval'],approved:['b-approved','Approved'],rejected:['b-rejected','Rejected'],ordered:['b-ordered','Ordered']};
  const [cls,label]=map[st]||['b-quoting',st]; return `<span class="badge ${cls}">${label}</span>`;
}
function quoteTotal(q, lines){
  let subtotal=0, complete=true;
  lines.forEach((ln,i)=>{ const p=q.prices[i]; if(p===''||p==null){complete=false;return;} subtotal += (+p)*(+ln.qty||0); });
  return {subtotal, total: subtotal+(+q.delivery||0), complete};
}
function bestTotal(r){
  const t = r.quotes.map(q=>quoteTotal(q,r.lines)).filter(t=>t.complete);
  return t.length? Math.min(...t.map(t=>t.total)) : null;
}
function recommended(r){
  let best=null;
  r.quotes.forEach((q,i)=>{ const t=quoteTotal(q,r.lines); if(!t.complete) return;
    if(!best || t.total<best.t.total) best={i,t}; });
  return best;
}
function audit(r, actor, action, note){
  r.audit.unshift({ts:Date.now(), actor, action, note:note||''});
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3200); }
const who = () => ({manager:'Ricardo Maio', purchaser:'S. Petersen (Purchasing)', requester:'Thabo M. (Operations)'})[db.role];

/* ============================== views ============================== */
const views = {};
function go(view, id){ db.view=view; db.viewId=id||null; save(); render(); }
function render(){
  const role = db.role;
  $('#roleSel').value = role;
  $('#whoLine').textContent = 'Signed in as ' + who();
  const v = db.view||'dash';
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
  counts();
  (views[v==='detail'?'detail':v]||views.dash)();
  window.scrollTo({top:0});
}
function counts(){
  const open = db.requests.filter(r=>['quoting','pending'].includes(r.status));
  const pend = db.requests.filter(r=>r.status==='pending');
  const c = {dash:pend.length, requests:db.requests.length, quotes:open.length, orders:db.requests.filter(r=>r.poNumber).length};
  document.querySelectorAll('.nav-btn').forEach(b=>{ const n=c[b.dataset.v]; b.querySelector('.count').textContent = n??''; });
}
function navHTML(){ return ''; }

/* ---------- dashboard (role-aware) ---------- */
views.dash = function(){
  const pend = db.requests.filter(r=>r.status==='pending');
  const quoting = db.requests.filter(r=>r.status==='quoting');
  const mine = db.role==='requester' ? db.requests.filter(r=>r.requester.startsWith('Thabo')) : db.requests;
  const stats = `
    <div class="stats">
      <div class="stat"><div class="n gold">${pend.length}</div><div class="l">Awaiting your approval</div></div>
      <div class="stat"><div class="n">${quoting.length}</div><div class="l">Out with purchasers (quoting)</div></div>
      <div class="stat"><div class="n">${db.requests.filter(r=>['approved','ordered'].includes(r.status)).length}</div><div class="l">Approved / ordered</div></div>
      <div class="stat"><div class="n">${db.requests.filter(r=>r.poNumber).length}</div><div class="l">POs generated</div></div>
    </div>`;
  let queue = '';
  if(pend.length){
    queue = `<div class="panel"><div class="panel-h"><h3>Approval queue</h3><span class="hint">${db.role==='manager'?'Open a request to review the line-by-line comparison':'Visible to the approval desk'}</span></div>
    <table><thead><tr><th>Request</th><th>Venture</th><th>Requested by</th><th class="right">Best total</th><th>Quotes</th><th></th></tr></thead><tbody>
    ${pend.map(r=>{ const b=bestTotal(r); const rec=recommended(r);
      return `<tr><td><b>${r.id}</b><div class="venture">${esc(r.venture)} · ${esc(r.department)}</div></td>
      <td>${esc(r.requester)}<div style="color:var(--faint);font-size:12px">${r.lines.length} line${r.lines.length>1?'s':''}</div></td>
      <td class="num">${b!=null?money(b):'—'}</td>
      <td>${r.quotes.filter(q=>quoteTotal(q,r.lines).complete).length}/3 attached${rec?` · <span style="color:var(--gold)">→ ${esc(r.quotes[rec.i].vendor.trim())}</span>`:''}</td>
      <td class="right"><button class="btn small" onclick="go('detail','${r.id}')">Review</button></td></tr>`;}).join('')}
    </tbody></table>`;
  } else {
    queue = `<div class="panel"><div class="empty" style="padding:44px"><div class="big" style="font-family:var(--display);font-size:17px;margin-bottom:6px">Approval queue is clear</div><div style="color:var(--muted)">Requests land here the moment their third quote is attached.</div></div></div>`;
  }
  const myAct = db.role==='requester'
    ? `<div class="panel"><div class="panel-h"><h3>My requests</h3></div><table><thead><tr><th>Ref</th><th>Status</th><th>Needed by</th></tr></thead><tbody>
       ${mine.map(r=>`<tr><td>${r.id}</td><td>${statusBadge(r.status)}</td><td class="num">${esc(r.neededBy)}</td></tr>`).join('')}</tbody></table></div>` : '';
  main().innerHTML = `
    <div class="topbar"><div>
      <div class="kicker">${db.role==='manager'?'Approval desk':db.role==='purchaser'?'Purchasing desk':'Department desk'}</div>
      <h2>${db.role==='manager'?'Awaiting your approval':db.role==='purchaser'?'Outstanding purchases':'Your requests'}</h2>
      <div class="sub">${db.role==='manager'
        ? 'Every request below carries three vendor quotes, compared line by line.'
        : db.role==='purchaser'
        ? 'Source three quotes per outstanding request, upload the documents, capture the prices.'
        : 'Track what you have asked purchasing for.'}</div>
    </div>
    <button class="btn" onclick="openNew()">＋ New purchase request</button></div>
    ${stats}${queue}${db.role==='requester'?myAct:''}`;
};

/* ---------- requests list ---------- */
views.requests = function(){
  main().innerHTML = `
    <div class="topbar"><div><div class="kicker">Register</div><h2>All purchase requests</h2></div>
    <button class="btn" onclick="openNew()">＋ New request</button></div>
    <div class="panel"><table><thead><tr><th>Ref</th><th>Venture / dept</th><th>Status</th><th class="right">Best total</th><th>Quotes</th><th>PO</th><th></th></tr></thead><tbody>
    ${db.requests.map(r=>{const b=bestTotal(r);
      return `<tr><td><b>${r.id}</b><div class="venture">needed ${esc(r.neededBy)}</div></td>
      <td>${esc(r.venture)}<div style="color:var(--faint);font-size:12px">${esc(r.department)} · ${esc(r.requester)}</div></td>
      <td>${statusBadge(r.status)}</td>
      <td class="num">${b!=null?money(b):'—'}</td>
      <td class="num">${r.quotes.length}/3</td>
      <td class="num">${r.poNumber?esc(r.poNumber):'—'}</td>
      <td class="right"><button class="btn small ghost" onclick="go('detail','${r.id}')">Open</button></td></tr>`;}).join('')}
    </tbody></table></div>`;
};

/* ---------- quoting queue (purchaser) ---------- */
views.quotes = function(){
  const open = db.requests.filter(r=>['quoting','pending'].includes(r.status));
  main().innerHTML = `
    <div class="topbar"><div><div class="kicker">Purchasing</div><h2>Outstanding &amp; awaiting approval</h2>
    <div class="sub">Everything open in the pipeline — source three quotes, upload documents, capture line prices.</div></div>
    <button class="btn" onclick="openNew()">＋ New purchase request</button></div>
    <div class="panel"><table><thead><tr><th>Ref</th><th>What's needed</th><th>Status</th><th class="right">Quotes</th><th></th></tr></thead><tbody>
    ${open.map(r=>`<tr><td><b>${r.id}</b><div class="venture">${esc(r.venture)}</div></td>
      <td>${r.lines.map(l=>esc(l.item)+' ×'+esc(l.qty)).join('<br>')}</td>
      <td class="right num">${r.quotes.length} / 3</td>
      <td class="right"><button class="btn small" onclick="go('detail','${r.id}')">${r.status==='quoting'?'Attach quotes':'Review'}</button></td></tr>`).join('')}
    </tbody></table></div>`;
};

/* ---------- detail ---------- */
views.detail = function(){
  const r = db.requests.find(x=>x.id===db.viewId);
  if(!r){ go('dash'); return; }
  const rec = recommended(r);
  const best = bestTotal(r);
  const isMgr = db.role==='manager', isPurch = db.role==='purchaser';
  const matrix = r.quotes.length ? `
    <div class="panel"><div class="panel-h"><h3>Comparison — line by line</h3><span class="hint">◆ Gold = recommended vendor (lowest total)</span></div>
    <table class="matrix"><thead><tr><th>Line item</th><th>Qty</th>${r.quotes.map((q,i)=>`<th class="vendor-h">${esc(q.vendor||'Vendor '+(i+1))}${rec&&rec.i===i?' ◆':''}</th>`).join('')}</tr></thead><tbody>
    ${r.lines.map((ln,i)=>`<tr><td><b>${esc(ln.item)}</b><div style="color:var(--faint);font-size:11.5px">${esc(ln.spec||'')}</div></td><td class="num">${esc(ln.qty)}</td>
      ${r.quotes.map((q,vi)=>{ const p=q.prices[i];
        if(p===''||p==null) return `<td class="gap num">missing</td>`;
        const isBest = rec && rec.i===vi; return `<td class="num ${isBest?'best-cell':''}">${money(p)}${isBest?' ◆':''}</td>`; }).join('')}</tr>`).join('')}
    <tr class="total"><td>Delivery</td><td></td>${r.quotes.map((q,vi)=>`<td class="num ${rec&&rec.i===vi?'best-cell':''}">${money(q.delivery||0)}</td>`).join('')}</tr>
    <tr class="total"><td>TOTAL</td><td></td>${r.quotes.map((q,vi)=>{const t=quoteTotal(q,r.lines);
      return `<td class="num ${rec&&rec.i===vi?'best-cell':''}">${t.complete?money(t.total):'—'}</td>`;}).join('')}</tr>
    <tr><td>Variance vs best</td><td></td>${r.quotes.map((q,vi)=>{const t=quoteTotal(q,r.lines); const b=best;
      if(!t.complete||b==null) return '<td class="num">—</td>';
      const v=(t.total-b)/b*100; return `<td class="num ${v===0?'best-cell':''}">${v===0?'best':'+'+v.toFixed(1)+'%'}</td>`;}).join('')}</tr>
    </tbody></table></div>` : `<div class="panel"><div class="empty" style="padding:38px;color:var(--muted)">No quotes attached yet.${isPurch?' Upload the three vendor quotes below.':''}</div></div>`;

  const quoteCards = r.quotes.map((q,vi)=>{ const t=quoteTotal(q,r.lines); const isRec = rec && rec.i===vi;
    return `<div class="qcard ${isRec?'winner':''}">
      <div class="vendor">${isRec?'<span class="crown">◆</span>':''}${esc(q.vendor||'Vendor '+(vi+1))}</div>
      <div class="qrow"><span>Delivery</span><span class="num">${money(q.delivery||0)}</span></div>
      <div class="qrow"><span>Lead time</span><span class="num">${esc(q.leadDays||'—')} days</span></div>
      <div class="qrow"><span>Valid until</span><span class="num">${esc(q.validUntil||'—')}</span></div>
      <div class="qrow"><span>Doc</span>${q.doc?`<span class="doc-chip">📄 ${esc(q.doc.name)}</span>`:'<span style="color:var(--red)">none</span>'}</div>
      <div class="qtotal"><span>${t.complete?'Total':'Incomplete'}</span><span class="num">${t.complete?money(t.total):'—'}</span></div>
      ${isMgr && r.status==='pending' ? `<button class="btn small approve" style="margin-top:10px;width:100%" onclick="approve(${vi})">Approve this vendor</button>`:''}
    </div>`;}).join('');

  const actions = [];
  if(r.status==='pending' && isMgr) actions.push(`<button class="btn reject" onclick="rejectReq()">Reject request…</button>`);
  if(r.status==='approved' && isPurch) actions.push(`<button class="btn" onclick="makePO(${r.winner})">Generate PO for ${esc(r.quotes[r.winner].vendor.trim())}</button>`);
  if(r.poNumber) actions.push(`<button class="btn ghost" onclick="exportZoho('${r.id}')">Export Zoho payload</button>`);
  if(r.poNumber) actions.push(`<button class="btn ghost" onclick="exportCSV('${r.id}')">PO CSV</button>`);

  main().innerHTML = `
    <div class="crumbs" onclick="go('dash')">← ${db.role==='manager'?'Approval desk':'Requests'}</div>
    <div class="topbar"><div>
      <div class="kicker">${esc(r.venture)} · ${esc(r.department)}</div>
      <h2 style="display:flex;align-items:center;gap:14px">${r.id} ${statusBadge(r.status)} ${r.status==='approved'?`<span class="stamp">Approved</span>`:''}${r.poNumber?`<span class="badge b-ordered">${r.poNumber}</span>`:''}</h2>
      <div class="sub">Needed by <span class="num">${esc(r.neededBy)}</span> · requested by ${esc(r.requester)}${r.notes?` — ${esc(r.notes)}`:''}</div>
    </div><div style="display:flex;gap:10px">${actions.join('')}</div></div>
    <div class="grid2">
      <div>
        ${matrix}
        <div class="panel"><div class="panel-h"><h3>Audit trail</h3></div>
          <div style="padding:14px 20px" class="audit">${r.audit.map(a=>`<div style="padding:7px 0;border-bottom:1px dashed var(--rule-soft)"><span class="t">${new Date(a.ts).toLocaleString('en-ZA',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span><b>${esc(a.actor)}</b> — ${esc(a.action)}${a.note?` <span style="color:var(--faint)">· ${esc(a.note)}</span>`:''}</div>`).join('')}</div>
        </div>
      </div>
      <div>
        <div class="panel"><div class="panel-h"><h3>Requested lines</h3></div>
          <table><tbody>${r.lines.map(l=>`<tr><td><b>${esc(l.item)}</b><div style="color:var(--faint);font-size:11.5px">${esc(l.spec||'')}</div></td><td class="num right">× ${esc(l.qty)}</td></tr>`).join('')}</tbody></table></div>
        <div class="panel"><div class="panel-h"><h3>Vendor quotes</h3><span class="hint">${r.quotes.length}/3${r.status==='quoting'?' — need 3 to submit for approval':''}</span></div>
          <div style="padding:14px" class="quote-cols">${r.quotes.map((q,vi)=>qcardMini(r,vi)).join('')}
          ${r.quotes.length<3 && (isPurch||db.role==='requester')?`<button class="btn small ghost" onclick="addQuote('${r.id}')">＋ Add quote</button>`:''}</div></div>
      </div>
    </div>`;
};
function qcardMini(r,vi){ const q=r.quotes[vi]; const t=quoteTotal(q,r.lines); const rec=recommended(r); const isRec=rec&&rec.i===vi; const isMgr=db.role==='manager';
  return `<div class="qcard" style="margin:0;padding:12px;${isRec?'border-color:var(--gold)':''}">
    <div class="vendor" style="font-size:12.5px">${isRec?'<span class="crown">◆</span>':''}${esc((q.vendor||'V'+(vi+1)).trim())}</div>
    <div class="qtotal" style="padding-top:6px"><span class="num" style="font-size:14px">${t.complete?money(t.total):'—'}</span></div>
    ${isMgr && r.status==='pending' ? `<button class="btn small approve" style="margin-top:8px;width:100%" onclick="approve(${vi})">Approve</button>`:''}</div>`; }

/* ---------- orders ---------- */
views.orders = function(){
  const ords = db.requests.filter(r=>r.poNumber);
  main().innerHTML = `
    <div class="topbar"><div><div class="kicker">After approval</div><h2>Purchase orders</h2>
    <div class="sub">Approved requests become POs. Export the Zoho Inventory payload for direct push (Phase 2 wires the live API — credentials in Settings).</div></div></div>
    ${ords.length? `<div class="panel"><table><thead><tr><th>PO</th><th>From request</th><th>Vendor</th><th class="right">Total</th><th></th></tr></thead><tbody>
    ${ords.map(r=>{const q=r.quotes[r.winner]; const t=quoteTotal(q,r.lines);
      return `<tr><td><b>${r.poNumber}</b></td><td>${r.id}<div class="venture">${esc(r.venture)}</div></td>
      <td>${esc(r.quotes[r.winner].vendor.trim())}</td><td class="num">${money(quoteTotal(q,r.lines).total)}</td>
      <td class="right" style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn small ghost" onclick="exportZoho('${r.id}')">Zoho JSON</button>
        <button class="btn small ghost" onclick="exportCSV('${r.id}')">CSV</button>
        <button class="btn small" onclick="go('detail','${r.id}')">Open</button></td></tr>`;}).join('')}
    </tbody></table></div>`
    : `<div class="panel"><div class="empty" style="padding:44px"><div style="font-family:var(--display);font-size:17px;margin-bottom:6px">No orders yet</div><div style="color:var(--muted)">Approve a request on the desk — it becomes a purchase order here.</div></div></div>`}`;
};

/* ---------- settings ---------- */
views.settings = function(){
  main().innerHTML = `
    <div class="topbar"><div><div class="kicker">Configuration</div><h2>Settings</h2></div></div>
    <div class="panel"><div class="panel-h"><h3>Zoho Inventory link (Phase 2)</h3></div>
      <div style="padding:18px" class="form-col" >
        <div class="form" style="grid-template-columns:1fr 1fr">
          <div class="field"><label>Organisation ID</label><input id="zOrg" value="${esc(db.zohoOrg||'')}" placeholder="e.g. 7g8k9…"></div>
          <div class="field"><label>Minimum quotes required</label><select id="qMin"><option>3</option><option>2</option></select></div>
          <div class="field full"><label>API location ( Books/Inventory region )</label>
            <select id="zReg"><option value="https://www.zohoapis.com/inventory/v1">zohoapis.com (US)</option>
            <option value="https://www.zohoapis.eu/inventory/v1">zohoapis.eu (EU)</option>
            <option value="https://www.zohoapis.in/inventory/v1">zohoapis.in (IN)</option></select></div>
          <div class="field full" style="color:var(--muted);font-size:12.5px">Direct push needs an OAuth token with <span class="num">ZohoInventory.purchaseorders.CREATE</span> scope. Until credentials are configured, every approved PO exports a ready payload — paste-ready for the API or import.</div>
        </div>
      </div></div>
    <div class="panel"><div class="panel-h"><h3>Data</h3></div>
      <div style="padding:18px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn ghost" onclick="backupAll()">Export full backup (JSON)</button>
        <label class="btn ghost" style="cursor:pointer">Import backup<input type="file" accept=".json" style="display:none" onchange="restoreAll(this)"></label>
        <button class="btn ghost" onclick="wipe()">Reset demo data</button>
      </div></div>`;
  $('#zOrg').addEventListener('change',e=>{db.zohoOrg=e.target.value.trim();save();});
  $('#zReg').addEventListener('change',e=>{db.zohoReg=e.target.value;save();});
  if(db.zohoReg) $('#zReg').value=db.zohoReg;
};

/* ============================== actions ============================== */
window.openNew = function(){
  const m=document.createElement('div'); m.className='modal-bg';
  m.innerHTML=`<div class="modal"><h3 style="font-family:var(--display);font-size:20px">New purchase request</h3>
    <div class="msub">What does the department need? Purchasing will source three quotes.</div>
    <div class="form">
      <div class="field"><label>Venture</label><select id="nVenture">${VENTURES.map(v=>`<option>${v}</option>`).join('')}</select></div>
      <div class="field"><label>Department</label><select id="nDept">${DEPTS.map(d=>`<option>${d}</option>`).join('')}</select></div>
      <div class="field"><label>Needed by</label><input type="date" id="nNeeded" value="${today()}"></div>
      <div class="field"><label>Requested by</label><input id="nReq" value="${who()}"></div>
      <div class="field full"><label>Notes</label><textarea id="nNotes" rows="2" placeholder="Context the approver should have"></textarea></div>
      <div class="field full"><label>Line items</label>
        <div class="lines-box"><table id="nLines"><tbody>
          <tr><td><input placeholder="Item" class="li"></td><td><input placeholder="Spec (optional)" class="ls"></td><td style="width:90px"><input placeholder="Qty" class="lq num" value="1"></td></tr>
        </tbody></table></div>
        <button class="addline" onclick="addLine()">＋ Add line</button></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitReq()">Submit request</button></div></div>`;
  document.body.appendChild(m);
};
window.addLine = function(){
  const tb=$('#nLines tbody'); const tr=document.createElement('tr');
  tr.innerHTML=`<td><input placeholder="Item" class="li"></td><td><input placeholder="Spec (optional)" class="ls"></td><td style="width:90px"><input placeholder="Qty" class="lq num" value="1"></td>`;
  tb.appendChild(tr); tr.querySelector('input').focus();
};
window.closeModal = () => document.querySelectorAll('.modal-bg').forEach(m=>m.remove());
window.submitReq = function(){
  const lines=[...$('#nLines tbody').rows].map(tr=>({
    item:tr.querySelector('.li').value.trim(), spec:tr.querySelector('.ls').value.trim(), qty:tr.querySelector('.lq').value.trim()||'1'
  })).filter(l=>l.item);
  if(!lines.length){ toast('Add at least one line item'); return; }
  db.seq.rq++;
  const r={ id:`RQ-${new Date().getFullYear()}-${String(db.seq.rq).padStart(4,'0')}`,
    venture:$('#nVenture').value, department:$('#nDept').value, requester:$('#nReq').value.trim()||who(),
    neededBy:$('#nNeeded').value, notes:$('#nNotes').value.trim(),
    status:'quoting', lines, quotes:[], winner:null, poNumber:null,
    audit:[{ts:Date.now(),actor:who(),action:'Request created',note:lines.length+' line(s)'}]};
  db.requests.unshift(r); save(); closeModal(); go('detail', r.id); toast('Request '+r.id+' submitted to purchasing');
};
window.addQuote = function(id){
  const r=db.requests.find(x=>x.id===id); if(!r) return;
  const m=document.createElement('div'); m.className='modal-bg';
  m.innerHTML=`<div class="modal"><h3 style="font-family:var(--display);font-size:20px">Attach vendor quote</h3>
    <div class="msub">Quote ${r.quotes.length+1} of 3 — upload the vendor document and capture line prices.</div>
    <div class="form">
      <div class="field full"><label>Vendor name</label><input id="qVendor" placeholder="Vendor name"></div>
      <div class="field full"><label>Quote document (PDF / image)</label><input type="file" id="qDoc" accept=".pdf,image/*"></div>
      <div class="field"><label>Delivery cost (R)</label><input type="number" id="qDel" value="0" min="0"></div>
      <div class="field"><label>Lead time (days)</label><input type="number" id="qLead" value="3" min="0"></div>
      <div class="field"><label>Valid until</label><input type="date" id="qValid"></div>
      <div class="field full"><label>Line prices (unit, R)</label>
        <div class="lines-box"><table><tbody>
        ${r.lines.map((l,i)=>`<tr><td>${esc(l.item)} ×${esc(l.qty)}</td><td style="width:120px"><input type="number" step="0.01" class="lp num" data-i="${i}" placeholder="0.00"></td></tr>`).join('')}
        </tbody></table></div></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveQuote('${id}')">Save quote</button></div></div>`;
  document.body.appendChild(m);
  $('#qDoc').addEventListener('change', e=>{ const f=e.target.files[0]; window._qDocName = f? f.name : null; });
};
window.saveQuote = function(id){
  const r=db.requests.find(x=>x.id===id); if(!r) return;
  const vendor=$('#qVendor').value.trim();
  if(!vendor){ toast('Vendor name required'); return; }
  const prices={}; let any=false;
  document.querySelectorAll('.lp').forEach(inp=>{ const v=inp.value.trim(); if(v!==''){ prices[+inp.dataset.i]=+v; any=true; } });
  const q={vendor, prices,
    delivery:+$('#qDel').value||0, leadDays:+$('#qLead').value||0, validUntil:$('#qValid').value,
    doc: window._qDocName? {name:window._qDocName, size:''} : null};
  r.quotes.push(q);
  audit(r, who(), 'Quote attached — '+vendor, r.quotes.length+'/3');
  if(r.quotes.length>=3 && r.status==='quoting'){
    const incomplete = r.quotes.filter(x=>!quoteTotal(x,r.lines).complete).length;
    r.status='pending';
    audit(r,'System','3 quotes — submitted for approval', incomplete? incomplete+' quote(s) have missing line prices — flagged in comparison':'');
    toast('3 quotes attached — now awaiting approval');
  } else toast('Quote saved ('+r.quotes.length+'/3)');
  save(); closeModal(); go('detail', id);
};
window.approve = function(vi){
  const r=db.requests.find(x=>x.id===db.viewId); if(!r) return;
  r.status='approved'; r.winner=vi;
  audit(r, who(), 'Approved — '+r.quotes[vi].vendor.trim(), 'Selected from '+r.quotes.length+' quotes');
  save(); toast('Approved '+r.id+' — '+r.quotes[vi].vendor.trim()); render();
};
window.rejectReq = function(){
  const r=db.requests.find(x=>x.id===db.viewId); if(!r) return;
  const note=prompt('Rejection reason (required):');
  if(note==null) return;
  r.status='rejected'; audit(r, who(), 'Rejected', note||'No reason given'); save(); toast('Request rejected'); render();
};
window.makePO = function(wi){
  const r=db.requests.find(x=>x.id===db.viewId); if(!r) return;
  r.winner=wi; r.status='ordered'; r.poNumber=`PO-${new Date().getFullYear()}-${String(db.seq.po).padStart(4,'0')}`; db.seq.po++;
  audit(r,'System', r.poNumber+' generated', 'Vendor: '+r.quotes[wi].vendor.trim());
  save(); go('orders'); toast(r.poNumber+' generated');
};
window.exportZoho = function(id){
  const r=db.requests.find(x=>x.id===id); const q=r.quotes[r.winner];
  const payload={
    vendor_name: q.vendor.trim(),
    reference_number: r.poNumber,
    date: today(),
    line_items: r.lines.map((l,i)=>({name:l.item, description:l.spec||'', rate:q.prices[i], quantity:+l.qty||1})),
    shipping_rate: +q.delivery||0,
    notes: `Quote Program ${r.id} — 3-quote approval on record. Approved by Ricardo Maio.`
  };
  download(r.poNumber+'-zoho-inventory-payload.json', JSON.stringify(payload,null,2),'application/json');
  toast('Zoho payload exported');
};
window.exportCSV = function(id){
  const r=db.requests.find(x=>x.id===id); const q=r.quotes[r.winner];
  const rows=[['PO','Date','Vendor','Item','Spec','Qty','Unit (R)','Line total (R)','Delivery (R)','GRAND TOTAL (R)']];
  let gt=0; r.lines.forEach((l,i)=>{ const lt=(q.prices[i]||0)*(+l.qty||0); gt+=lt;
    rows.push([r.poNumber,today(),q.vendor.trim(),l.item,l.spec,l.qty,q.prices[i]||'',lt.toFixed(2),'','']); });
  gt+=+q.delivery||0; rows.push([r.poNumber,today(),q.vendor.trim(),'','','','','',(+q.delivery||0).toFixed(2),gt.toFixed(2)]);
  const csv=rows.map(rw=>rw.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  download(r.poNumber+'.csv', csv, 'text/csv');
  toast('CSV exported');
};
window.backupAll = function(){ download('quote-program-backup-'+today()+'.json', JSON.stringify(db,null,2),'application/json'); toast('Backup exported'); };
window.restoreAll = function(inp){ const f=inp.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ db=JSON.parse(rd.result); save(); toast('Backup restored'); render(); }catch(e){ toast('Invalid backup file'); } };
  rd.readAsText(f); };
window.wipe = function(){ db=seed(); save(); render(); toast('Demo data reset'); };
function download(name, content, type){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click();
}
function audit(r, actor, action, note){ r.audit.unshift({ts:Date.now(), actor, action, note:note||''}); }

/* ============================== wiring ============================== */
document.getElementById('nav').innerHTML = `
  <button class="nav-btn" data-v="dash">◈ Approval desk<span class="count"></span></button>
  <button class="nav-btn" data-v="requests">All requests<span class="count"></span></button>
  <button class="nav-btn" data-v="quotes">Quoting queue<span class="count"></span></button>
  <button class="nav-btn" data-v="orders">Orders · Zoho<span class="count"></span></button>
  <button class="nav-btn" data-v="settings">Settings<span class="count"></span></button>`;
document.addEventListener('click', e=>{
  const b=e.target.closest('.nav-btn'); if(b) go(b.dataset.v);
});
document.getElementById('roleSel').addEventListener('change', e=>{ db.role=e.target.value; save(); go('dash'); });
render();
</script>
</body>
</html>
