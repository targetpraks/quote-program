<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quorum — Purchasing Desk</title>
<script src="https://cdn.jsdelivr.net/npm/pocketbase/dist/pocketbase.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --obsidian:#0B0F1A; --panel:#131A2B; --panel2:#0F1524; --rule:#24314D; --rule-soft:#1B2438;
  --ink:#E8ECF4; --muted:#8A94A8; --faint:#5A6478;
  --gold:#D4AF6A; --gold-deep:#A9823F; --gold-soft:rgba(212,175,106,.14);
  --green:#3E9B6F; --green-soft:rgba(62,155,111,.14);
  --red:#C25B5B; --red-soft:rgba(194,91,91,.13);
  --amber:#D99A3D; --amber-soft:rgba(217,154,61,.13);
  --mono:'JetBrains Mono',monospace; --body:'Inter',sans-serif; --display:'Fraunces',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
body{background:var(--obsidian);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;min-height:100vh}
::selection{background:var(--gold-soft)}
a{color:var(--gold)}
button{font-family:var(--body)}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
/* ── sidebar ── */
aside{background:var(--panel2);border-right:1px solid var(--rule-soft);padding:22px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:0 22px 20px;border-bottom:1px solid var(--rule-soft)}
.brand .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.brand h1{font-family:var(--display);font-weight:600;font-size:21px;margin-top:6px;color:var(--ink)}
nav{flex:1;padding:18px 10px;display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--muted);font:500 13.5px var(--body);padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;border-left:2px solid transparent}
.nav-btn:hover{color:var(--ink);background:rgba(255,255,255,.03)}
.nav-btn.active{color:var(--ink);background:var(--gold-soft);border-left:2px solid var(--gold)}
.nav-btn .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--gold);background:rgba(212,175,106,.1);padding:1px 7px;border-radius:99px}
.rolebox{padding:16px 22px 0;border-top:1px solid var(--rule-soft)}
.rolebox label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;color:var(--faint)}
.rolebox select{width:100%;margin-top:8px;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:9px 10px;font:500 13px var(--body)}
.rolebox .who{margin-top:8px;font-size:12px;color:var(--muted)}
/* ── main ── */
main{padding:34px 40px 80px;max-width:1240px;width:100%}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}
.topbar .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.topbar h2{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.01em;margin-top:6px}
.topbar .sub{color:var(--muted);margin-top:6px;font-size:13.5px;max-width:60ch}
.btn{background:var(--gold);color:#14100A;border:0;font:600 13px var(--body);padding:10px 16px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--rule)}
.btn.ghost:hover{color:var(--ink);border-color:var(--gold)}
.btn.small{padding:6px 11px;font-size:12px;border-radius:7px}
.btn.approve{background:var(--green)}
.btn.reject{background:transparent;color:var(--red);border:1px solid rgba(194,91,91,.5)}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat{background:var(--panel);border:1px solid var(--rule-soft);border-radius:12px;padding:16px 18px}
.stat .n{font-family:var(--mono);font-weight:600;font-size:26px;color:var(--ink)}
.stat .n.gold{color:var(--gold)}
.stat .l{color:var(--muted);font-size:12px;margin-top:4px}
main{margin-inline:auto}
/* panels & tables */
.panel{background:var(--panel);border:1px solid var(--rule-soft);border-radius:14px;overflow:hidden;margin-bottom:22px}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--rule-soft)}
.panel-h h3{font:600 14.5px var(--body)}
.panel-h .hint{color:var(--faint);font-size:12px}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:1px solid var(--rule);font-weight:600;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
tbody tr:hover{background:rgba(255,255,255,.02)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.right{text-align:right}
.badge{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--body);padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-quoting{background:var(--amber-soft,rgba(217,154,61,.13));color:var(--amber)}
.b-pending{background:var(--gold-soft);color:var(--gold)}
.b-approved{background:var(--green-soft);color:var(--green)}
.b-rejected{background:var(--red-soft);color:var(--red)}
.b-ordered{background:rgba(90,140,220,.14);color:#7EA6E8}
.venture{font:600 11px var(--mono);color:var(--muted);letter-spacing:.04em}
/* catalog entity filters */
.chipbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.chip{background:var(--panel);border:1px solid var(--rule-soft);color:var(--muted);font:600 12.5px var(--body);padding:7px 13px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--rule)}
.chip.active{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.chip .count{font-family:var(--mono);font-size:11px;color:var(--gold)}
.chip.search{cursor:text;padding:5px 13px}
.chip.search input{background:none;border:0;outline:none;color:var(--ink);font:500 12.5px var(--body);width:200px}
.chip.search input::placeholder{color:var(--faint)}
/* request detail */
.crumbs{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:12.5px;margin-bottom:14px;cursor:pointer}
.crumbs b{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv-k{color:var(--faint)}
.quote-cols{grid-template-columns:1fr;gap:10px;margin-top:12px}
.qcard{background:var(--panel2);border:1px solid var(--rule-soft);border-radius:12px;padding:14px;position:relative}
.qcard.winner{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.qcard .vendor{font:600 14px var(--body);display:flex;align-items:center;gap:8px}
.qcard .crown{color:var(--gold);font-size:13px}
.qrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:5px 0;border-bottom:1px dashed var(--rule-soft)}
.qrow .num{color:var(--ink);white-space:nowrap}
.qtotal{display:flex;justify-content:space-between;padding-top:10px;font:600 14px var(--body);white-space:nowrap}
.qtotal .num{color:var(--gold);font-size:15px}
.variance{font-family:var(--mono);font-size:11px;color:var(--red);margin-top:2px}
.variance.best{color:var(--green)}
.doc-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--rule-soft);border-radius:7px;padding:4px 9px;font-size:11.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* matrix */
.matrix th.vendor-h{color:var(--gold)}
.matrix th:not(:first-child),.matrix td:not(:first-child){text-align:right}
.matrix td.gap{color:var(--red);font-style:italic}
.matrix tr.total-row td{border-top:2px solid var(--rule);font-weight:600;color:var(--ink)}
.matrix td.best-cell{color:var(--gold);font-weight:600}
.stamp{display:inline-block;font:600 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--green);border:2px solid var(--green);border-radius:6px;padding:4px 10px;transform:rotate(-4deg)}
.stamp.gold{color:var(--gold);border-color:var(--gold)}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font:600 12px var(--body);color:var(--muted)}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--rule);border-radius:8px;color:var(--ink);padding:9px 11px;font:400 13px var(--body)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
.lines-box{border:1px solid var(--rule-soft);border-radius:10px;overflow:hidden}
.lines-box table td{padding:8px 10px}
.lines-box input{width:100%;background:transparent;border:0;color:var(--ink);font:400 13px var(--body)}
.lines-box input:focus{outline:none}
.addline{color:var(--gold);background:none;border:0;font:600 12.5px var(--body);cursor:pointer;padding:9px 14px}
.modal-bg{position:fixed;inset:0;background:rgba(5,8,15,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:26px;width:720px;max-width:96vw;max-height:92vh;overflow:auto}
.modal h3{font-family:var(--display);font-size:21px;font-weight:600;margin-bottom:4px}
.modal .msub{color:var(--muted);font-size:13px;margin-bottom:18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--ink);padding:11px 18px;border-radius:10px;font:500 13px var(--body);z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.audit{font-size:12.5px;color:var(--muted)}
.audit .t{font-family:var(--mono);font-size:11px;color:var(--faint);margin-right:8px}
.empty{padding:40px;text-align:center;color:var(--faint)}
.empty .big{font-family:var(--display);font-size:17px;color:var(--muted);margin-bottom:6px}
pre.payload{background:var(--panel2);border:1px solid var(--rule-soft);border-radius:10px;padding:14px;font:400 11.5px var(--mono);overflow:auto;max-height:340px;color:#B9C4DA}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  aside{position:relative;height:auto;flex-direction:row;align-items:center;gap:12px;padding:12px 16px}
  nav{flex-direction:row;overflow-x:auto;padding:0}
  .brand h1{font-size:16px}
  .rolebox{border:0;padding:0 8px}
  main{padding:22px 16px 60px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2,.quote-cols,.form-col{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.stamp{animation:stamp .35s ease-out}@keyframes stamp{0%{transform:rotate(-4deg) scale(1.6);opacity:0}100%{transform:rotate(-4deg);opacity:1}}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="eyebrow">Purchasing desk</div>
      <h1>Quorum</h1>
    </div>
    <nav id="nav"></nav>
    <div class="rolebox" id="rolebox"></div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ============================== state ============================== */
const PB_URL = 'http://127.0.0.1:8090';
const pb = new PocketBase(PB_URL);
const VENTURES = ['Infinity Brands','The Local Farmer','Papa Pasta','INFX Media','INFX Solutions','INFX Labs','FluxFlow','ACDC Express'];
const OWNER_EMAIL = 'you@example.com'; // PO notification recipient — set to your owner/finance inbox
const DEPTS = ['Operations','Purchasing','Sales & Marketing','Finance','Production','Logistics','Admin','IT'];
const money = n => 'R ' + (Math.round((+n||0)*100)/100).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
const today = () => new Date().toISOString().slice(0,10);

/* ─── Quorum v2 helpers ─── */
const THRESHOLDS = {auto:5000, manager:50000, countersign:250000};
const lineTotVatExcl = (line) => {
  // prices entries: {i, p, vat} — normalise to VAT-exclusive
  const p = +line.p||0;
  if(line.vat === 'incl') return p/1.15;
  return p;
};
const quoteTotalV2 = (q, lines) => {
  let subtotal=0, complete=true, allVat=true;
  const prices = q.prices;
  const isV2 = Array.isArray(prices) && prices.length>0 && typeof prices[0]==='object' && prices[0]!==null && ('i' in prices[0]);
  lines.forEach((ln,i)=>{
    let entry;
    if(isV2) entry = (prices||[]).find(e=>e.i===i);
    else { const v = prices ? prices[i] : null; entry = (v==null||typeof v==='object') ? v : {p:v}; }
    if(entry==null || entry.p==='' || entry.p==null){complete=false;return;}
    if(!entry.vat){allVat=false;return;}
    subtotal += lineTotVatExcl(entry)*(+ln.qty||0);
  });
  return {subtotal, total: subtotal+(+q.delivery||0), complete, allVat};
};
const bestTotalV2 = (r) => {
  const t = (r.quotes||[]).map(q=>quoteTotalV2(q,r.lines)).filter(t=>t.complete && t.allVat);
  return t.length ? Math.min(...t.map(x=>x.total)) : null;
};
const recommendedV2 = (r) => {
  let best=null;
  (r.quotes||[]).forEach((q,i)=>{
    const t=quoteTotalV2(q,r.lines);
    if(!t.complete || !t.allVat) return;
    if(!best || t.total<best.t.total) best={i,t};
  });
  return best;
};
const bandFor = (r) => r.approval_band || 'manager';
const approverFor = (band) => ({auto:'Auto (2 bids + tolerance)', manager:'Venture manager', countersign:'Manager + owner countersign', owner:'Owner only'})[band]||band;
const priceOf = (q, i) => {
  const pr = q && q.prices;
  if (Array.isArray(pr) && pr.length && typeof pr[0]==='object' && pr[0]!==null) {
    const e = pr.find(x=>x && x.i===i); return e ? e.p : null;
  }
  return pr ? pr[i] : null;
};
const priceEntry = (q, i) => {
  const pr = q && q.prices;
  if (Array.isArray(pr) && pr.length && typeof pr[0]==='object' && pr[0]!==null) return pr.find(x=>x && x.i===i)||null;
  return (pr && pr[i]!=null && typeof pr[i]!=='object') ? {i, p:pr[i]} : null;
};
const rateExcl = (q, i) => { const e = priceEntry(q,i); if(e==null) return null; const v = +lineTotVatExcl(e); return isNaN(v) ? null : Math.round(v*100)/100; };


let db = { view:'dash', viewId:null, role:null, user:null };
let REQUESTS = [];

async function loadRequests(){
  const recs = await pb.collection('qp_requests').getFullList();
  REQUESTS = recs.map(r => ({
    id: r.ref, pbId: r.id, venture: r.venture, department: r.department,
    requester: r.requester, requesterId: r.requester_id, neededBy: (r.needed_by||'').slice(0,10),
    notes: r.notes || '', status: r.status, winner: r.winner, poNumber: r.po_number,
    approvalBand: r.approval_band || 'manager', awardNote: r.award_note || '', estTotal: r.est_total,
    lines: r.lines || [], audit: r.audit || [], quotes: []
  }));
  const qs = await pb.collection('qp_quotes').getFullList();
  for(const q of qs){
    const req = REQUESTS.find(r => r.pbId === q.request);
    if(!req) continue;
    req.quotes.push({
      pbId: q.id, vendor: q.vendor, prices: q.prices,  // keep full v2 shape [{i,p,vat}]
      delivery: q.delivery||0, leadDays: q.lead_days, validUntil: (q.valid_until||'').slice(0,10),
      doc: q.doc ? {name: q.doc, url: pb.files.getUrl(q, q.doc)} : null
    });
  }
}
function save(){ /* server-backed */ }

/* ============================== helpers ============================== */
const $ = s => document.querySelector(s);
const main = () => $('#main');
const fmtD = ts => new Date(ts).toLocaleDateString('en-ZA',{day:'2-digit',month:'short'});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function statusBadge(st){
  const map={quoting:['b-quoting','Quoting'],pending:['b-pending','Pending approval'],approved:['b-approved','Approved'],rejected:['b-rejected','Rejected'],ordered:['b-ordered','Ordered']};
  const [cls,label]=map[st]||['b-quoting',st]; return `<span class="badge ${cls}">${label}</span>`;
}
function quoteTotal(q, lines){
  const t = quoteTotalV2(q, lines);
  return {subtotal:t.subtotal, total:t.total, complete:t.complete && t.allVat};
}
function bestTotal(r){
  const t = r.quotes.map(q=>quoteTotal(q,r.lines)).filter(t=>t.complete);
  return t.length? Math.min(...t.map(t=>t.total)) : null;
}
function recommended(r){
  let best=null;
  r.quotes.forEach((q,i)=>{ const t=quoteTotal(q,r.lines); if(!t.complete) return;
    if(!best || t.total<best.t.total) best={i,t}; });
  return best;
}
function audit(r, actor, action, note){
  r.audit.unshift({ts:Date.now(), actor, action, note:note||''});
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3200); }
const who = () => db.user ? db.user.name : '';
function backLabel(){ const m={dash: db.role==='manager'?'Approval desk':'Dashboard', requests:'All requests', quotes:'Quoting queue', orders:'Purchase orders', vendors:'Vendors', catalog:'Catalog', notifications:'Alerts', users:'Staff', settings:'Settings'}; return m[db.prev||'dash']||'Back to list'; }

/* ============================== views ============================== */
const views = {};
function go(view, id){ if(view==='detail' && db.view && db.view!=='detail') db.prev=db.view; db.view=view; db.viewId=id||null; save(); render(); }
function render(){
  const mainEl = main();
  if(!db.user){
    document.querySelector('nav').innerHTML = '';
    document.getElementById('rolebox').innerHTML = '';
    mainEl.innerHTML = loginPage();
    document.getElementById('liBtn').addEventListener('click', login);
    return;
  }
  const role = db.role;
  const navDef = [
    role==='manager'  && ['dash','◈ Approval desk'],
    ['requests','All requests'],
    role==='purchaser' && ['quotes','Quoting queue'],
    ['vendors','Vendors'],
    ['catalog','Catalog'],
    role!=='requester' && ['notifications','Alerts'],
    role==='manager' && ['users','Staff'],
    ['orders','Orders · Zoho'],
    ['settings','Settings'],
  ].filter(Boolean);
  document.querySelector('nav').innerHTML = navDef.map(([v,l]) =>
    `<button class="nav-btn" data-v="${v}">${l}<span class="count"></span></button>`).join('');
  document.getElementById('rolebox').innerHTML = userHTML();
  document.getElementById('btn-logout').addEventListener('click', logout);
  const v = db.view||'dash';
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
  counts();
  const viewFn = views[v==='detail'?'detail':v]||views.dash;
  const out = viewFn();
  if(out instanceof Promise) out.catch(err=>{ console.error(err); toast('Load failed: '+(err.message||err)); });
  window.scrollTo({top:0});
}
function userHTML(){
  return `<label style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase">Signed in</label>
  <div style="margin-top:8px;font:600 13px var(--body)">${esc(db.user.name)}</div>
  <div style="color:var(--muted);font-size:12px;margin:2px 0 10px">${esc(db.user.email)} · ${esc(db.role)}</div>
  <button class="btn ghost small" id="btn-logout" style="width:100%">Sign out</button>`;
}
function loginPage(){
  return `<div style="display:flex;justify-content:center;padding-top:9vh">
  <div class="panel" style="width:420px;padding:34px">
    <div class="kicker" style="font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)">Purchasing desk</div>
    <h2 style="font-family:var(--display);font-size:26px;font-weight:600;margin:8px 0 4px">Quorum</h2>
    <div style="color:var(--muted);font-size:13px;margin-bottom:20px">Sign in with your staff account.</div>
    <div class="form" style="grid-template-columns:1fr">
      <div class="field"><label>Email</label><input id="liEmail" type="email" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="liPass" type="password" autocomplete="current-password"></div>
      <button class="btn" id="liBtn" style="margin-top:6px">Sign in</button>
      <div id="liErr" style="color:var(--red);font-size:12.5px;min-height:18px"></div>
    </div></div></div>`;
}
function counts(){
  const pend = REQUESTS.filter(r=>r.status==='pending');
  const open = REQUESTS.filter(r=>['quoting','pending'].includes(r.status));
  const c = {dash:pend.length, requests:REQUESTS.length, quotes:open.length, orders:REQUESTS.filter(r=>r.poNumber).length};
  // async counts for v2 views (fire-and-forget)
  if(db.user && (db.role==='manager'||db.role==='purchaser')){

/* ---------- detail ---------- */
views.detail = function(){
  const r = REQUESTS.find(x=>x.pbId===db.viewId);
  if(!r){ go('dash'); return; }
  const rec = recommended(r);
  const best = bestTotal(r);
  const isMgr = db.role==='manager', isPurch = db.role==='purchaser';
  const matrix = r.quotes.length ? `
    <div class="panel"><div class="panel-h"><h3>Comparison — line by line</h3><span class="hint">◆ Gold = recommended vendor (lowest total)</span></div>
    <table class="matrix"><thead><tr><th>Line item</th><th>Qty</th>${r.quotes.map((q,i)=>`<th class="vendor-h">${esc(q.vendor||'Vendor '+(i+1))}${rec&&rec.i===i?' ◆':''}</th>`).join('')}</tr></thead><tbody>
    ${r.lines.map((ln,i)=>`<tr><td><b>${esc(ln.item)}</b><div style="color:var(--faint);font-size:11.5px">${esc(ln.spec||'')}</div></td><td class="num">${esc(ln.qty)}</td>
      ${r.quotes.map((q,vi)=>{ const p=priceOf(q,i);
        if(p===''||p==null) return `<td class="gap num">missing</td>`;
        const isBest = rec && rec.i===vi; return `<td class="num ${isBest?'best-cell':''}">${money(p)}${isBest?' ◆':''}</td>`; }).join('')}</tr>`).join('')}
    <tr class="total"><td>Delivery</td><td></td>${r.quotes.map((q,vi)=>`<td class="num ${rec&&rec.i===vi?'best-cell':''}">${money(q.delivery||0)}</td>`).join('')}</tr>
    <tr class="total"><td>TOTAL</td><td></td>${r.quotes.map((q,vi)=>{const t=quoteTotal(q,r.lines);
      return `<td class="num ${rec&&rec.i===vi?'best-cell':''}">${t.complete?money(t.total):'—'}</td>`;}).join('')}</tr>
    <tr><td>Variance vs best</td><td></td>${r.quotes.map((q,vi)=>{const t=quoteTotal(q,r.lines); const b=best;
      if(!t.complete||b==null) return '<td class="num">—</td>';
      const v=(t.total-b)/b*100; return `<td class="num ${v===0?'best-cell':''}">${v===0?'best':'+'+v.toFixed(1)+'%'}</td>`;}).join('')}</tr>
    </tbody></table></div>` : `<div class="panel"><div class="empty" style="padding:38px;color:var(--muted)">No quotes attached yet.${isPurch?' Upload the three vendor quotes below.':''}</div></div>`;

  const quoteCards = r.quotes.map((q,vi)=>{ const t=quoteTotal(q,r.lines); const isRec = rec && rec.i===vi;
    return `<div class="qcard ${isRec?'winner':''}">
      <div class="vendor">${isRec?'<span class="crown">◆</span>':''}${esc(q.vendor||'Vendor '+(vi+1))}</div>
      <div class="qrow"><span>Delivery</span><span class="num">${money(q.delivery||0)}</span></div>
      <div class="qrow"><span>Lead time</span><span class="num">${esc(q.leadDays||'—')} days</span></div>
      <div class="qrow"><span>Valid until</span><span class="num">${esc(q.validUntil||'—')}</span></div>
      <div class="qrow"><span>Doc</span>${q.doc?`<span class="doc-chip">📄 ${esc(q.doc.name)}</span>`:'<span style="color:var(--red)">none</span>'}</div>
      <div class="qtotal"><span>${t.complete?'Total':'Incomplete'}</span><span class="num">${t.complete?money(t.total):'—'}</span></div>
      ${isMgr && r.status==='pending' ? `<button class="btn small approve" style="margin-top:10px;width:100%" onclick="approve(${vi})">Approve this vendor</button>`:''}
    </div>`;}).join('');

  const actions = [];
  if(r.status==='pending' && isMgr) actions.push(`<button class="btn reject" onclick="rejectReq()">Reject request…</button>`);
  if(r.status==='approved' && (isPurch||isMgr)) actions.push(`<button class="btn" onclick="makePO(${r.winner})">Generate PO for ${esc(r.quotes[r.winner].vendor.trim())}</button>`);
  if(r.poNumber) actions.push(`<button class="btn ghost" onclick="exportZoho('${r.pbId}')">Export Zoho payload</button>`);
  if(r.poNumber) actions.push(`<button class="btn ghost" onclick="exportCSV('${r.pbId}')">PO CSV</button>`);

  main().innerHTML = `
    <div class="crumbs" onclick="go(db.prev||'dash')">← ${backLabel()}</div>
    <div class="topbar"><div>
      <div class="kicker">${esc(r.venture)} · ${esc(r.department)}</div>
      <h2 style="display:flex;align-items:center;gap:14px">${r.id} ${statusBadge(r.status)} ${r.status==='approved'?`<span class="stamp">Approved</span>`:''}${r.poNumber?`<span class="badge b-ordered">${r.poNumber}</span>`:''}</h2>
      <div class="sub">Needed by <span class="num">${esc(r.neededBy)}</span> · requested by ${esc(r.requester)}${r.notes?` — ${esc(r.notes)}`:''}</div>
    </div><div style="display:flex;gap:10px">${actions.join('')}</div></div>
    <div class="grid2">
      <div>
        ${matrix}
        <div class="panel"><div class="panel-h"><h3>Audit trail</h3></div>
          <div style="padding:14px 20px" class="audit">${r.audit.map(a=>`<div style="padding:7px 0;border-bottom:1px dashed var(--rule-soft)"><span class="t">${new Date(a.ts).toLocaleString('en-ZA',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span><b>${esc(a.actor)}</b> — ${esc(a.action)}${a.note?` <span style="color:var(--faint)">· ${esc(a.note)}</span>`:''}</div>`).join('')}</div>
        </div>
      </div>
      <div>
        <div class="panel"><div class="panel-h"><h3>Requested lines</h3></div>
          <table><tbody>${r.lines.map(l=>`<tr><td><b>${esc(l.item)}</b><div style="color:var(--faint);font-size:11.5px">${esc(l.spec||'')}</div></td><td class="num right">× ${esc(l.qty)}</td></tr>`).join('')}</tbody></table></div>
        <div class="panel"><div class="panel-h"><h3>Vendor quotes</h3><span class="hint">${r.quotes.length}/3${r.status==='quoting'?' — need 3 to submit for approval':''}</span></div>
          <div style="padding:14px" class="quote-cols">${r.quotes.map((q,vi)=>qcardMini(r,vi)).join('')}
          ${r.quotes.length<3 && (isPurch||isMgr||db.role==='requester')?`<button class="btn small ghost" onclick="addQuote('${r.pbId}')">＋ Add quote</button>`:''}</div></div>
      </div>
    </div>`;
};
function qcardMini(r,vi){ const q=r.quotes[vi]; const t=quoteTotal(q,r.lines); const rec=recommended(r); const isRec=rec&&rec.i===vi; const isMgr=db.role==='manager';
  return `<div class="qcard" style="margin:0;padding:12px;${isRec?'border-color:var(--gold)':''}">
    <div class="vendor" style="font-size:12.5px">${isRec?'<span class="crown">◆</span>':''}${esc((q.vendor||'V'+(vi+1)).trim())}</div>
    <div class="qtotal" style="padding-top:6px"><span class="num" style="font-size:14px">${t.complete?money(t.total):'—'}</span></div>
    ${q.doc?`<a class="doc-chip" style="margin-top:8px;display:inline-flex;max-width:100%" href="${q.doc.url}" target="_blank">📄 ${esc(q.doc.name)}</a>`:''}
    ${isMgr && r.status==='pending' ? `<button class="btn small approve" style="margin-top:8px;width:100%" onclick="approve(${vi})">Approve</button>`:''}</div>`; }

window.saveQuote = async function(id){
  const r=REQUESTS.find(x=>x.pbId===id); if(!r) return;
  const vendor=document.getElementById('qVendor').value.trim();
  if(!vendor){ toast('Vendor name required'); return; }
  const docInput = document.getElementById('qDoc');
  const fd = new FormData();
  fd.append('request', r.pbId);
  fd.append('vendor', vendor);
  const prices=[]; let vatMissing=false;
  document.querySelectorAll('.lp').forEach(inp=>{
    if(inp.value!==''){
      const vat = (document.querySelector(`.lv[data-i="${inp.dataset.i}"]`)||{}).value || '';
      if(!vat) vatMissing=true;
      prices.push({i:+inp.dataset.i, p:+inp.value, vat});
    }
  });
  if(!prices.length){ toast('Capture at least one line price'); return; }
  if(vatMissing){ toast('VAT status required per priced line (excl / incl / zero-rated)'); return; }
  fd.append('prices', JSON.stringify(prices));
  fd.append('delivery', document.getElementById('qDel').value||'0');
  fd.append('lead_days', document.getElementById('qLead').value||'0');
  if(document.getElementById('qValid').value) fd.append('valid_until', document.getElementById('qValid').value+' 00:00:00.000Z');
  fd.append('uploaded_by', db.user.name);
  if(docInput.files[0]) fd.append('doc', docInput.files[0]);
  try{
    await pb.collection('qp_quotes').create(fd);
    // Audit append + 3-quote flip are enforced server-side (pb_hooks/quorum.pb.js)
    await loadRequests(); closeModal(); go('detail', id);
    toast('Quote saved — ' + vendor);
  }catch(e){ toast('Upload failed: ' + (e.message||e)); }
};
window.approve = async function(vi){
  const r=REQUESTS.find(x=>x.pbId===db.viewId); if(!r) return;
  const t=quoteTotalV2(r.quotes[vi], r.lines);
  const best=bestTotalV2(r);
  let memo='';
  if((r.quotes||[]).length < 3){
    memo = prompt('Sole-source / emergency waiver — this award has fewer than 3 bids. Justification (required):');
    if(memo==null || !memo.trim()){ toast('Waiver justification required to award below 3 bids'); return; }
    memo = 'SOLE-SOURCE WAIVER: ' + memo;
  } else if(best!=null && t.total>best+0.009){
    memo=prompt('Override memo — why not the cheapest compliant bid? (required):');
    if(memo==null || !memo.trim()){ toast('Override memo required to award a non-cheapest vendor'); return; }
  }
  const alreadySigned = (r.audit||[]).some(a=>a.action && a.action.indexOf('Manager signed')===0);
  if(r.approvalBand==='countersign' && !alreadySigned){
    // first signature; owner must countersign (do NOT change status/winner yet)
    try{
      await pb.collection('qp_requests').update(r.pbId, {
        award_note: memo || '',
        audit:[{ts:new Date().toISOString(), actor:db.user.name, action:'Manager signed — awaiting owner countersign', note:(memo?('Override: '+memo):'')+' | Vendor: '+r.quotes[vi].vendor.trim()}, ...(r.audit||[])]
      });
      await loadRequests(); toast('Manager signature recorded — owner countersign required'); render(); return;
    }catch(e){ toast('Failed: '+(e.message||e)); return; }
  }
  try{
    await pb.collection('qp_requests').update(r.pbId, {
      status:'approved', winner:vi, award_note: memo || (best!=null && Math.abs(t.total-best)<=0.009 ? 'Lowest compliant bid' : ''),
      approval_band: r.approvalBand,
      audit:[{ts:new Date().toISOString(), actor:db.user.name, action:'Approved — '+r.quotes[vi].vendor.trim(),
              note:(memo?('Override memo: '+memo+' · '):'')+'Band: '+r.approvalBand}, ...(r.audit||[])]
    });
    // outbox entry for PO push
    await loadRequests();
    toast('Awarded to '+r.quotes[vi].vendor.trim()+(memo?' (override memo filed)':'')); render();
  }catch(e){ toast('Approval failed: '+(e.message||e)); }
};

window.makePO = async function(wi){
  const r=REQUESTS.find(x=>x.pbId===db.viewId); if(!r) return;
  let poN = REQUESTS.filter(x=>(x.poNumber||'').startsWith('PO-'+new Date().getFullYear())).length + 1;
  let po = `PO-${new Date().getFullYear()}-${String(poN).padStart(4,'0')}`;
  while (REQUESTS.some(x=>x.poNumber===po)) { poN += 1; po = `PO-${new Date().getFullYear()}-${String(poN).padStart(4,'0')}`; }
  const q=r.quotes[wi];
  try{
    await pb.collection('qp_requests').update(r.pbId, {
      status:'ordered', winner:wi, po_number:po,
      audit:[{ts:new Date().toISOString(), actor:'System', action:po+' generated', note:'Vendor: '+q.vendor.trim()}, ...(r.audit||[])]
    });
    // outbox: Zoho push queue (pushed=manual until OAuth wired)
    await pb.collection('q_outbox').create({
      po_number: po, request_ref: r.id, push_status: 'manual',
      payload: {vendor_name:q.vendor.trim(), reference_number:po, date: today(),
      line_items: r.lines.map((l,i)=>({name:l.item, description:l.spec||'', rate:rateExcl(q,i), quantity:+l.qty||1})),
                shipping_rate:+q.delivery||0}
    });
    // notification
    await pb.collection('q_notifications').create({
      user_email:OWNER_EMAIL, kind:'po', title:po+' generated',
      body:r.id+' awarded to '+q.vendor.trim()
    }).catch(ne=>{ console.warn('notif skipped:', ne.message); });
    await loadRequests(); go('orders'); toast(po+' generated — queued for Zoho');
  }catch(e){ toast('Failed: '+(e.message||e)); }
};

    <div class="topbar"><div><div class="kicker">Configuration</div><h2>Settings</h2></div></div>
    <div class="panel"><div class="panel-h"><h3>Zoho Inventory link (Phase 2)</h3></div>
      <div style="padding:18px">
        <div class="form" style="grid-template-columns:1fr 1fr">
          <div class="field"><label>Organisation ID</label><input id="zOrg" value="${esc(localStorage.getItem('qp_zoho_org')||'')}" placeholder="e.g. 7g8k9…"></div>
          <div class="field"><label>Minimum quotes required</label><select id="qMin"><option>3</option><option>2</option></select></div>
          <div class="field full"><label>API location</label>
            <select id="zReg"><option value="https://www.zohoapis.com/inventory/v1">zohoapis.com (US)</option>
            <option value="https://www.zohoapis.eu/inventory/v1">zohoapis.eu (EU)</option>
            <option value="https://www.zohoapis.in/inventory/v1">zohoapis.in (IN)</option></select></div>
          <div class="field full" style="color:var(--muted);font-size:12.5px">Direct push needs an OAuth token with <span class="num">ZohoInventory.purchaseorders.CREATE</span> scope. Until credentials are configured, every approved PO exports a ready payload.</div>
        </div></div></div>
    <div class="panel"><div class="panel-h"><h3>Data</h3></div>
      <div style="padding:18px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn ghost" onclick="backupAll()">Export backup (JSON)</button>
        <span style="color:var(--faint);font-size:12.5px;align-self:center">Server-backed on PocketBase · ${PB_URL}</span>
      </div></div>`;
  document.getElementById('zOrg').addEventListener('change',e=>localStorage.setItem('qp_zoho_org', e.target.value.trim()));
};

/* ============================== wiring ============================== */
document.getElementById('nav').innerHTML = '';
document.addEventListener('click', e=>{
  const b=e.target.closest('.nav-btn'); if(b) go(b.dataset.v);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && (e.target.id==='liEmail'||e.target.id==='liPass')) login();
});

async function boot(){
  if(pb.authStore.isValid){
    db.user = pb.authStore.record;
    db.role = pb.authStore.record.role;
    try { await loadRequests(); } catch(e){ console.error(e); }
  }
  render();
}
boot();</script>
</body>
</html>
