<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://127.0.0.1:8090; img-src 'self' http://127.0.0.1:8090 data: blob:; media-src 'self'">
<title>Quorum — Purchasing Desk</title>
<script src="https://cdn.jsdelivr.net/npm/pocketbase/dist/pocketbase.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --obsidian:#0B0F1A; --panel:#131A2B; --panel2:#0F1524; --rule:#24314D; --rule-soft:#1B2438;
  --ink:#E8ECF4; --muted:#8A94A8; --faint:#5A6478;
  --gold:#D4AF6A; --gold-deep:#A9823F; --gold-soft:rgba(212,175,106,.14);
  --green:#3E9B6F; --green-soft:rgba(62,155,111,.14);
  --red:#C25B5B; --red-soft:rgba(194,91,91,.13);
  --amber:#D99A3D; --amber-soft:rgba(217,154,61,.13);
  --mono:'JetBrains Mono',monospace; --body:'Inter',sans-serif; --display:'Fraunces',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
body{background:var(--obsidian);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;min-height:100vh}
::selection{background:var(--gold-soft)}
a{color:var(--gold)}
button{font-family:var(--body)}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
/* ── sidebar ── */
aside{background:var(--panel2);border-right:1px solid var(--rule-soft);padding:22px 0 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:0 22px 18px;border-bottom:1px solid var(--rule-soft)}
.brand .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.brand h1{font-family:var(--display);font-weight:600;font-size:21px;margin-top:6px;background:linear-gradient(90deg,var(--ink) 45%,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold)}
nav{flex:1;padding:14px 10px 4px;display:flex;flex-direction:column;overflow-y:auto}
.side-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:linear-gradient(180deg,#DFBC79,#C89E55);color:#14100A;border:0;font:700 13px var(--body);padding:10px 12px;border-radius:9px;cursor:pointer;margin-bottom:16px;box-shadow:0 6px 18px rgba(212,175,106,.16)}
.side-cta:hover{filter:brightness(1.07)}
.nav-sec{margin-bottom:13px}
.nav-sec-l{display:flex;align-items:center;gap:7px;padding:0 12px 7px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8C99B0}
.nav-sec-l::before{content:'';width:5px;height:5px;border-radius:2px;background:var(--sec,#7A869D);box-shadow:0 0 8px var(--sec,#7A869D)}
.nav-sec-l::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.10),transparent)}
.sec-gold{--sec:#E4C27E}.sec-blue{--sec:#7EA6E8}.sec-green{--sec:#57B98A}.sec-violet{--sec:#A495E8}
.nav-btn{--tone:var(--muted);--tone-soft:rgba(255,255,255,.05);--tone-hover:rgba(255,255,255,.035);display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#A7B2C8;font:500 13.5px var(--body);padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left;border-left:2px solid transparent;margin-bottom:2px;transition:background .15s,color .15s,border-color .15s}
.nav-btn .nico{width:16px;text-align:center;color:var(--tone);font-size:13px;line-height:1;opacity:.9}
.nav-btn .nlab{flex:1;min-width:0}
.nav-btn:hover{color:var(--ink);background:var(--tone-hover);border-left-color:var(--tone)}
.nav-btn:hover .nico{opacity:1}
.nav-btn.active{color:var(--ink);font-weight:600;background:var(--tone-soft);border-left:2px solid var(--tone)}
.nav-btn.active .nico{opacity:1;text-shadow:0 0 10px var(--tone)}
.nav-btn .count{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;color:#0B0F1A;background:var(--tone);border:1px solid var(--tone);padding:0 7px;border-radius:99px;min-width:20px;text-align:center;opacity:.92}
.nav-btn.active .count{opacity:1;box-shadow:0 0 12px var(--tone)}
.nav-btn .count:empty{display:none}
/* per-destination tone — one colour per place, instant recognition */
.t-gold{--tone:#E4C27E;--tone-soft:rgba(212,175,106,.17);--tone-hover:rgba(212,175,106,.08)}
.t-blue{--tone:#7EA6E8;--tone-soft:rgba(126,166,232,.16);--tone-hover:rgba(126,166,232,.08)}
.t-green{--tone:#57B98A;--tone-soft:rgba(87,185,138,.16);--tone-hover:rgba(87,185,138,.08)}
.t-teal{--tone:#54B2B4;--tone-soft:rgba(84,178,180,.16);--tone-hover:rgba(84,178,180,.08)}
.t-amber{--tone:#E0A852;--tone-soft:rgba(224,168,82,.16);--tone-hover:rgba(224,168,82,.08)}
.t-violet{--tone:#A495E8;--tone-soft:rgba(164,149,232,.16);--tone-hover:rgba(164,149,232,.08)}
.rolebox{padding:15px 22px 2px;border-top:1px solid var(--rule-soft)}
.rolebox .rb-name{margin-top:9px;font:600 13.5px var(--body);color:var(--ink)}
.rolebox .rb-mail{color:var(--muted);font-size:11.5px;margin:8px 0 12px;word-break:break-all}
#btn-logout{width:100%}
.role-chip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tone);background:var(--tone-soft);border:1px solid var(--tone);border-radius:999px;padding:3px 10px}
/* ── main ── */
main{padding:34px 40px 80px;max-width:1240px;width:100%}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}
.topbar .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.topbar h2{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.01em;margin-top:6px}
.topbar .sub{color:var(--muted);margin-top:6px;font-size:13.5px;max-width:60ch}
.btn{background:var(--gold);color:#14100A;border:0;font:600 13px var(--body);padding:10px 16px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--rule)}
.btn.ghost:hover{color:var(--ink);border-color:var(--gold)}
.btn.small{padding:6px 11px;font-size:12px;border-radius:7px}
.btn.approve{background:var(--green)}
.btn.reject{background:transparent;color:var(--red);border:1px solid rgba(194,91,91,.5)}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat{background:var(--panel);border:1px solid var(--rule-soft);border-radius:12px;padding:16px 18px}
.stat .n{font-family:var(--mono);font-weight:600;font-size:26px;color:var(--ink)}
.stat .n.gold{color:var(--gold)}
.stat .n.amber{color:var(--amber)}
.stat .n.green{color:var(--green)}
.stat .n.blue{color:#7EA6E8}
.stat .n.teal{color:#54B2B4}
.stat .l{color:var(--muted);font-size:12px;margin-top:4px}
main{margin-inline:auto}
/* panels & tables */
.panel{background:var(--panel);border:1px solid var(--rule-soft);border-radius:14px;overflow:hidden;margin-bottom:22px}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--rule-soft)}
.panel-h h3{font:600 14.5px var(--body)}
.panel-h .hint{color:var(--faint);font-size:12px}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:1px solid var(--rule);font-weight:600;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
tbody tr:hover{background:rgba(255,255,255,.02)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.right{text-align:right}
.badge{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--body);padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-quoting{background:var(--amber-soft,rgba(217,154,61,.13));color:var(--amber)}
.b-pending{background:var(--gold-soft);color:var(--gold)}
.b-approved{background:var(--green-soft);color:var(--green)}
.b-rejected{background:var(--red-soft);color:var(--red)}
.b-ordered{background:rgba(90,140,220,.14);color:#7EA6E8}
.venture{font:600 11px var(--mono);color:var(--muted);letter-spacing:.04em}
/* catalog entity filters */
.chipbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.chip{background:var(--panel);border:1px solid var(--rule-soft);color:var(--muted);font:600 12.5px var(--body);padding:7px 13px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--rule)}
.chip.active{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.chip .count{font-family:var(--mono);font-size:11px;color:var(--gold)}
.chip.search{cursor:text;padding:5px 13px}
.chip.search input{background:none;border:0;outline:none;color:var(--ink);font:500 12.5px var(--body);width:200px}
.chip.search input::placeholder{color:var(--faint)}
.chip.select-pill{gap:4px}
.chip select{background:transparent;border:0;outline:none;color:var(--ink);font:600 12.5px var(--body);max-width:170px}
.chip select option{background:var(--panel2);color:var(--ink)}
.chipbar.sub{margin-top:-8px}
/* request detail */
.crumbs{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:12.5px;margin-bottom:14px;cursor:pointer}
.crumbs b{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv-k{color:var(--faint)}
.quote-cols{grid-template-columns:1fr;gap:10px;margin-top:12px}
.qcard{background:var(--panel2);border:1px solid var(--rule-soft);border-radius:12px;padding:14px;position:relative}
.qcard.winner{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.qcard .vendor{font:600 14px var(--body);display:flex;align-items:center;gap:8px}
.qcard .crown{color:var(--gold);font-size:13px}
.qrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:5px 0;border-bottom:1px dashed var(--rule-soft)}
.qrow .num{color:var(--ink);white-space:nowrap}
.qtotal{display:flex;justify-content:space-between;padding-top:10px;font:600 14px var(--body);white-space:nowrap}
.qtotal .num{color:var(--gold);font-size:15px}
.variance{font-family:var(--mono);font-size:11px;color:var(--red);margin-top:2px}
.variance.best{color:var(--green)}
.doc-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--rule-soft);border-radius:7px;padding:4px 9px;font-size:11.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* matrix */
.matrix th.vendor-h{color:var(--gold)}
.matrix th:not(:first-child),.matrix td:not(:first-child){text-align:right}
.matrix td.gap{color:var(--red);font-style:italic}
.matrix tr.total-row td{border-top:2px solid var(--rule);font-weight:600;color:var(--ink)}
.matrix td.best-cell{color:var(--gold);font-weight:600}
.stamp{display:inline-block;font:600 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--green);border:2px solid var(--green);border-radius:6px;padding:4px 10px;transform:rotate(-4deg)}
.stamp.gold{color:var(--gold);border-color:var(--gold)}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font:600 12px var(--body);color:var(--muted)}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--rule);border-radius:8px;color:var(--ink);padding:9px 11px;font:400 13px var(--body)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
.lines-box{border:1px solid var(--rule-soft);border-radius:10px;overflow:hidden}
.lines-box table td{padding:8px 10px}
.lines-box input{width:100%;background:transparent;border:0;color:var(--ink);font:400 13px var(--body)}
.lines-box input:focus{outline:none}
.addline{color:var(--gold);background:none;border:0;font:600 12.5px var(--body);cursor:pointer;padding:9px 14px}
.modal-bg{position:fixed;inset:0;background:rgba(5,8,15,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:26px;width:720px;max-width:96vw;max-height:92vh;overflow:auto}
.modal h3{font-family:var(--display);font-size:21px;font-weight:600;margin-bottom:4px}
.modal .msub{color:var(--muted);font-size:13px;margin-bottom:18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--ink);padding:11px 18px;border-radius:10px;font:500 13px var(--body);z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.audit{font-size:12.5px;color:var(--muted)}
.audit .t{font-family:var(--mono);font-size:11px;color:var(--faint);margin-right:8px}
.empty{padding:40px;text-align:center;color:var(--faint)}
.empty .big{font-family:var(--display);font-size:17px;color:var(--muted);margin-bottom:6px}
pre.payload{background:var(--panel2);border:1px solid var(--rule-soft);border-radius:10px;padding:14px;font:400 11.5px var(--mono);overflow:auto;max-height:340px;color:#B9C4DA}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  aside{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px}
  .brand{padding:0;border:0}
  .brand .eyebrow{display:none}
  .brand h1{font-size:16px;margin-top:0}
  nav{order:3;flex:1 1 100%;flex-direction:row;overflow-x:auto;padding:2px 0 4px;gap:6px;scrollbar-width:thin}
  .nav-sec{display:flex;flex-direction:row;gap:4px;margin:0}
  .nav-sec-l{display:none}
  .nav-btn{width:auto;white-space:nowrap;margin-bottom:0}
  .side-cta{display:none}
  .rolebox{border:0;padding:0;margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
  .rolebox label{display:none}
  .rolebox .rb-name{margin:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22vw}
  .rolebox .role-chip{margin-top:0}
  .rolebox .rb-mail{display:none}
  #btn-logout{width:auto;white-space:nowrap}
  main{padding:22px 16px 60px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2,.quote-cols,.form-col,.form{grid-template-columns:1fr!important}
}
@media print{
  aside,.topbar,.chipbar,.panel-h .hint,td .btn,td .btn.small,td .btn.ghost,.crumbs,#globalSearchWrap,#printActions{display:none!important}
  body{background:#fff;color:#000}
  .app{grid-template-columns:1fr!important}
  main{padding:0;max-width:none}
  .panel,.stat{background:#fff;border:1px solid #ccc;color:#000}
  .panel-h h3{color:#000}
  .num{font-family:var(--mono)}
  #poPrintSheet{display:block!important}
}
@media (prefers-reduced-motion:no-preference){.stamp{animation:stamp .35s ease-out}@keyframes stamp{0%{transform:rotate(-4deg) scale(1.6);opacity:0}100%{transform:rotate(-4deg);opacity:1}}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.topbar-search{position:relative;flex:1;max-width:320px}
.topbar-search input{width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:9px;color:var(--ink);padding:9px 12px 9px 34px;font:400 13px var(--body)}
.topbar-search input:focus{outline:none;border-color:var(--gold)}
.topbar-search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:14px}
.error-panel{padding:26px 20px;text-align:center}
.error-panel .big{font-family:var(--display);font-size:17px;margin-bottom:8px;color:var(--red)}
.inline-err{color:var(--red);font-size:12px;margin-top:4px;min-height:18px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="eyebrow">Purchasing desk</div>
      <h1>Quorum</h1>
    </div>
    <nav id="nav"></nav>
    <div class="rolebox" id="rolebox"></div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ============================== state ============================== */
const PB_URL = 'http://127.0.0.1:8090';
const pb = new PocketBase(PB_URL);
const OWNER_EMAIL = 'you@example.com'; // PO notification recipient — set to your owner/finance inbox
const VENTURES = ['Infinity Brands','The Local Farmer','Papa Pasta','INFX Media','INFX Solutions','INFX Labs','FluxFlow','ACDC Express'];
const DEPTS = ['Operations','Purchasing','Sales & Marketing','Finance','Production','Logistics','Admin','IT'];
const money = n => 'R ' + (Math.round((+n||0)*100)/100).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
const today = () => new Date().toISOString().slice(0,10);

/* ─── Quorum v2 helpers ─── */
const THRESHOLDS = {auto:5000, manager:50000, countersign:250000};
const lineTotVatExcl = (line) => {
  // prices entries: {i, p, vat} — normalise to VAT-exclusive
  const p = +line.p||0;
  if(line.vat === 'incl') return p/1.15;
  return p;
};
const quoteTotalV2 = (q, lines) => {
  let subtotal=0, complete=true, allVat=true;
  const prices = q.prices;
  const isV2 = Array.isArray(prices) && prices.length>0 && typeof prices[0]==='object' && prices[0]!==null && ('i' in prices[0]);
  lines.forEach((ln,i)=>{
    let entry;
    if(isV2) entry = (prices||[]).find(e=>e.i===i);
    else { const v = prices ? prices[i] : null; entry = (v==null||typeof v==='object') ? v : {p:v}; }
    if(entry==null || entry.p==='' || entry.p==null){complete=false;return;}
    if(!entry.vat){allVat=false;return;}
    subtotal += lineTotVatExcl(entry)*(+ln.qty||0);
  });
  return {subtotal, total: subtotal+(+q.delivery||0), complete, allVat};
};
const bestTotalV2 = (r) => {
  const t = (r.quotes||[]).map(q=>quoteTotalV2(q,r.lines)).filter(t=>t.complete && t.allVat);
  return t.length ? Math.min(...t.map(x=>x.total)) : null;
};
const recommendedV2 = (r) => {
  let best=null;
  (r.quotes||[]).forEach((q,i)=>{
    const t=quoteTotalV2(q,r.lines);
    if(!t.complete || !t.allVat) return;
    if(!best || t.total<best.t.total) best={i,t};
  });
  return best;
};
const bandFor = (r) => r.approval_band || 'manager';
const approverFor = (band) => ({auto:'Auto (2 bids + tolerance)', manager:'Venture manager', countersign:'Manager + owner countersign', owner:'Owner only'})[band]||band;
const priceOf = (q, i) => {
  const pr = q && q.prices;
  if (Array.isArray(pr) && pr.length && typeof pr[0]==='object' && pr[0]!==null) {
    const e = pr.find(x=>x && x.i===i); return e ? e.p : null;
  }
  return pr ? pr[i] : null;
};
const priceEntry = (q, i) => {
  const pr = q && q.prices;
  if (Array.isArray(pr) && pr.length && typeof pr[0]==='object' && pr[0]!==null) return pr.find(x=>x && x.i===i)||null;
  return (pr && pr[i]!=null && typeof pr[i]!=='object') ? {i, p:pr[i]} : null;
};
const rateExcl = (q, i) => { const e = priceEntry(q,i); if(e==null) return null; const v = +lineTotVatExcl(e); return isNaN(v) ? null : Math.round(v*100)/100; };

const isAuthError = e => { const s = e?.status || e?.response?.status || e?.data?.code; return s===401 || s===403 || (s===404 && db.user); };
const logoutExpired = msg => { pb.authStore.clear(); db.user=null; db.role=null; REQUESTS=[]; toast(msg||'Session expired — sign in again'); go('dash'); };
function handleWriteErr(e, fallback){
  if(isAuthError(e)){ logoutExpired('Session expired — please sign in again'); return; }
  const m = e?.message || e?.response?.message || fallback || 'Request failed';
  toast(m);
}
const matchesGlobalSearch = (r, term) => {
  if(!term) return true;
  const t = term.toLowerCase();

};
const validateQty = v => {

const validatePrice = v => {

function openModal(html){
  const m=document.createElement('div'); m.className='modal-bg'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
  m.innerHTML=html;
  document.body.appendChild(m);
  const focusable = m.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  const first = focusable[0];
  if(first) first.focus();
  m.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ e.preventDefault(); closeModal(); if(FOCUS_TRIGGER) FOCUS_TRIGGER.focus(); }
    if(e.key==='Tab' && focusable.length){
      const active = document.activeElement;
      if(e.shiftKey && active===first){ e.preventDefault(); focusable[focusable.length-1].focus(); }
      else if(!e.shiftKey && active===focusable[focusable.length-1]){ e.preventDefault(); first.focus(); }
    }
  });
}

  const map={quoting:['b-quoting','Quoting'],pending:['b-pending','Pending approval'],approved:['b-approved','Approved'],rejected:['b-rejected','Rejected'],ordered:['b-ordered','Ordered']};
  const [cls,label]=map[st]||['b-quoting',st]; return `<span class="badge ${cls}">${label}</span>`;

function quoteTotal(q, lines){
  const t = quoteTotalV2(q, lines);
  return {subtotal:t.subtotal, total:t.total, complete:t.complete && t.allVat};
}
function bestTotal(r){
  const t = r.quotes.map(q=>quoteTotal(q,r.lines)).filter(t=>t.complete);
  return t.length? Math.min(...t.map(t=>t.total)) : null;
}
function recommended(r){
  let best=null;
  r.quotes.forEach((q,i)=>{ const t=quoteTotal(q,r.lines); if(!t.complete) return;
    if(!best || t.total<best.t.total) best={i,t}; });
  return best;
}

views.detail = function(){
  const r = REQUESTS.find(x=>x.pbId===db.viewId);

    ${r.lines.map((ln,i)=>`<tr><td><b>${esc(ln.item)}</b><div style="color:var(--faint);font-size:11.5px">${esc(ln.spec||'')}</div></td><td class="num">${esc(ln.qty)}</td>
      ${r.quotes.map((q,vi)=>{ const p=priceOf(q,i);

    <tr class="total"><td>Delivery</td><td></td>${r.quotes.map((q,vi)=>`<td class="num ${rec&&rec.i===vi?'best-cell':''}">${money(q.delivery||0)}</td>`).join('')}</tr>

    </div>`;}).join('');

  const actions = [];

function poPrintSheet(r){

    rows += `<tr><td>${esc(l.item)}</td><td>${esc(l.spec||'')}</td><td class="num">${esc(l.qty)}</td><td class="num">R ${money(pu).replace('R ','')}</td><td class="num right">R ${money(lt).replace('R ','')}</td></tr>`;

      </div>
    </div>
  </div>`;
}

window.submitReq = async function(btn){
  const errEl = document.getElementById('nFormErr');

  const lines=[]; let qtyErr=null;

    const item = tr.querySelector('.li').value.trim();

    if(qe && !qtyErr) qtyErr = `Line "${item}": ${qe}`;

  if(!lines.length){ errEl.textContent='Add at least one line item.'; return; }
  if(qtyErr){ errEl.textContent=qtyErr; return; }
  if(btn){ btn.disabled=true; btn.textContent='Submitting…'; }

  const yr = new Date().getFullYear();
  let n = REQUESTS.filter(r=>r.id.startsWith('RQ-'+yr)).length + 1;
  let ref = `RQ-${yr}-${String(n).padStart(4,'0')}`;
  while (REQUESTS.some(r=>r.id===ref)) { n += 1; ref = `RQ-${yr}-${String(n).padStart(4,'0')}`; }

window.saveQuote = async function(id, btn){

  if(fileErr){ errEl.textContent=fileErr; return; }
  const prices=[]; let vatMissing=false; let priceErr=null;
  document.querySelectorAll('.lp').forEach(inp=>{
    if(inp.value!==''){
      const pe = validatePrice(inp.value);

      const vat = (document.querySelector(`.lv[data-i="${inp.dataset.i}"]`)||{}).value || '';

window.approve = async function(vi, btn){
  const r=REQUESTS.find(x=>x.pbId===db.viewId); if(!r) return;
  const t=quoteTotalV2(r.quotes[vi], r.lines);
  const best=bestTotalV2(r);
  let memo='';
  if((r.quotes||[]).length < 3){
    memo = prompt('Sole-source / emergency waiver — this award has fewer than 3 bids. Justification (required):');
    if(memo==null || !memo.trim()){ toast('Waiver justification required to award below 3 bids'); return; }
    memo = 'SOLE-SOURCE WAIVER: ' + memo;
  } else if(best!=null && t.total>best+0.009){
    memo=prompt('Override memo — why not the cheapest compliant bid? (required):');
    if(memo==null || !memo.trim()){ toast('Override memo required to award a non-cheapest vendor'); return; }
  }
  if(btn){ btn.disabled=true; btn.textContent='Recording…'; }
  const alreadySigned = (r.audit||[]).some(a=>a.action && a.action.indexOf('Manager signed')===0);
  if(r.approvalBand==='countersign' && !alreadySigned){
    // first signature; owner must countersign (do NOT change status/winner yet)
    try{
      await pb.collection('qp_requests').update(r.pbId, {
        award_note: memo || '',
        audit:[{ts:new Date().toISOString(), actor:db.user.name, action:'Manager signed — awaiting owner countersign', note:(memo?('Override: '+memo):'')+' | Vendor: '+r.quotes[vi].vendor.trim()}, ...(r.audit||[])]
      });
      await loadRequests(); toast('Manager signature recorded — owner countersign required'); render(); return;
    }catch(e){ if(btn){ btn.disabled=false; btn.textContent='Approve this vendor'; } handleWriteErr(e, 'Approval failed'); return; }
  }
  try{
    await pb.collection('qp_requests').update(r.pbId, {
      status:'approved', winner:vi, award_note: memo || (best!=null && Math.abs(t.total-best)<=0.009 ? 'Lowest compliant bid' : ''),
      approval_band: r.approvalBand,
      audit:[{ts:new Date().toISOString(), actor:db.user.name, action:'Approved — '+r.quotes[vi].vendor.trim(),
              note:(memo?('Override memo: '+memo+' · '):'')+'Band: '+r.approvalBand}, ...(r.audit||[])]
    });
    // outbox entry for PO push
    await loadRequests();
    toast('Awarded to '+r.quotes[vi].vendor.trim()+(memo?' (override memo filed)':'')); render();
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent='Approve this vendor'; } handleWriteErr(e, 'Approval failed'); }
};

window.exportRequestsCSV = function(list){
  const rows=[['Ref','Status','Venture','Department','Requester','Needed by','Best total (R)','Quotes','PO','Notes']];
  for(const r of list){
    // `bestTotal` applies the brand VAT gate (a bid with no VAT status never
    // ranks). Correct for RANKING, but as an export column it produced an
    // empty cell for legacy rows whose bids predate the VAT field. Show the
    // strict figure when it exists, else fall back to the arithmetic minimum
    // so the export always carries a number when quotes do.
    const strict = bestTotal(r);
    let b = strict;
    if(b==null){
      const totals = r.quotes.map(q=>quoteTotal(q,r.lines)).filter(t=>t.complete);
      b = totals.length ? Math.min(...totals.map(t=>t.total)) : null;
    }
    rows.push([r.id, r.status, r.venture, r.department, r.requester, r.neededBy,
               b!=null?money(b).replace('R ',''):'', r.quotes.length+'/3', r.poNumber||'', r.notes]);
  }
  downloadCsv('requests-'+today()+'.csv', rows);
  toast('Requests CSV exported');
};
window.exportOrdersCSV = function(list){
  const rows=[['PO','Date','From request','Venture','Department','Requester','Vendor','Total (R)']];
  for(const r of list){
    const q=r.quotes[r.winner]; const t=q?quoteTotal(q,r.lines):null;
    // Mirror EXACTLY what the orders register shows on screen (it prints
    // quoteTotal().total unconditionally). Gating the export on `t.complete`
    // made the CSV disagree with the UI: legacy quotes predating the VAT
    // field have allVat=false, so they rendered a total on screen but
    // exported a blank cell. One rule everywhere: if the screen shows a
    // number, the export carries it.
    rows.push([r.poNumber||'', today(), r.id, r.venture, r.department, r.requester,
               q?q.vendor.trim():'', t?t.total.toFixed(2):'']);
  }
  downloadCsv('orders-'+today()+'.csv', rows);
  toast('Orders CSV exported');
};

function download(name, content, type){
  const blob = new Blob([content],{type});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.setAttribute('aria-live','polite'); t.setAttribute('aria-atomic','true'); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3400); }

    venture: document.getElementById('uVenture').value, active: true
  };
  if(!rec.name || !rec.email || !rec.password){ errEl.textContent='Name, email and password are required.'; return; }
  errEl.textContent='';
  if(btn){ btn.disabled=true; btn.textContent='Creating…'; }
  try{
    await pb.collection('qp_users').create(rec);
    closeModal(); FOCUS_TRIGGER=null; toast('Account created'); views.users();
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent='Create account'; } handleWriteErr(e, 'Create failed'); }
};
window.toggleUser = async function(uid, active, btn){
  if(btn){ btn.disabled=true; btn.textContent=active?'Enabling…':'Disabling…'; }
  try{ await pb.collection('qp_users').update(uid, {active}); views.users(); }
  catch(e){ if(btn){ btn.disabled=false; btn.textContent=active?'Enable':'Disable'; } handleWriteErr(e, 'Update failed'); }
};
window.delUser = async function(uid, btn){
  if(!confirm('Delete this staff account?')) return;
  if(btn){ btn.disabled=true; btn.textContent='Deleting…'; }
  try{ await pb.collection('qp_users').delete(uid); toast('Account deleted'); views.users(); }
  catch(e){ if(btn){ btn.disabled=false; btn.textContent='Delete'; } handleWriteErr(e, 'Delete failed'); }
};

/* ============================== wiring ============================== */
document.getElementById('nav').innerHTML = '';
document.addEventListener('click', e=>{
  const b=e.target.closest('.nav-btn'); if(b){ go(b.dataset.v); return; }
  const side=e.target.closest('#sideNew');
  if(side){ FOCUS_TRIGGER=side; openNew(side); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && (e.target.id==='liEmail'||e.target.id==='liPass')) login();
});

async function boot(){
  if(pb.authStore.isValid){
    db.user = pb.authStore.record;
    db.role = pb.authStore.record.role;
    db.view = homeView(db.role);
    try { await loadRequests(); } catch(e){ console.error(e); }
  }
  render();
}
boot();</script>
